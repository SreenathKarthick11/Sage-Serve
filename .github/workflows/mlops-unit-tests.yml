name: MLOps Unit Tests

on:
  push:
    branches: [ main, sreenath/ci-cd ]
    paths:
      - 'mlops/**'
      - '.github/workflows/mlops-unit-tests.yml'
  pull_request:
    branches: [ main, sreenath/ci-cd ]
    paths:
      - 'mlops/**'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Environment & Run Unit Tests
        run: |
          cd mlops

          # Create and activate virtual environment
          python -m venv .venv
          source .venv/bin/activate

          # Install dependencies
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          # Run the requested module unit tests
          python -m unittest tests.test_inference -v
          python -m unittest tests.test_etl -v
          python -m unittest tests.test_forecasting -v
          python -m unittest tests.test_model_registry -v